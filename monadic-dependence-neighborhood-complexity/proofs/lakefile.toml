name = "Lax5Proofs"
defaultTargets = ["Lax5Proofs"]

[leanOptions]
autoImplicit = false

# mathlib is part of the archive environment (the pin is archive-wide)
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "c5ea00351c28e24afc9f0f84379aa41082b1188f"

[[require]]
name = "Lax5"
path = "../concepts"

# sparsity lectures: the quasi-wideness and coloring-number statements of
# submission Lax12
[[require]]
name = "Lax12"
git = "https://github.com/lax-archive/lax-submissions"
rev = "3767b962ad65db56ea2151e9a4c762eae14541e5"
subDir = "sparsity-lectures/concepts"

# finite Ramsey theorems: the Ramsey statements of submission Lax14
[[require]]
name = "Lax14"
git = "https://github.com/lax-archive/lax-submissions"
rev = "4973144e692e941c0da137f33c05fa3e6eeea827"
subDir = "finite-ramsey/concepts"

[[lean_lib]]
name = "Lax5Proofs"
