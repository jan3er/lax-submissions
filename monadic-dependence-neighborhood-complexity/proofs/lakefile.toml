name = "Lax5Proofs"
defaultTargets = ["Lax5Proofs"]

[leanOptions]
autoImplicit = false

# mathlib is part of the archive environment (the pin is archive-wide)
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "c5ea00351c28e24afc9f0f84379aa41082b1188f"

[[require]]
name = "Lax5"
path = "../concepts"

# sparsity lectures: the quasi-wideness and neighborhood-complexity
# statements of submission Lax12
[[require]]
name = "Lax12"
git = "https://github.com/lax-archive/lax-submissions"
rev = "7567bb4ed5a67705fe11f4958bb5d62aded02616"
subDir = "sparsity-lectures/concepts"

# finite Ramsey theorems: the Ramsey statements of submission Lax14
[[require]]
name = "Lax14"
git = "https://github.com/lax-archive/lax-submissions"
rev = "590ca0d1d9f9a690edbfe86b165b47830504c91a"
subDir = "finite-ramsey/concepts"

[[lean_lib]]
name = "Lax5Proofs"
