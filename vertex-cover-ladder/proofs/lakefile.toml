name = "Lax15Proofs"
defaultTargets = ["Lax15Proofs"]

[leanOptions]
autoImplicit = false

# mathlib is part of the archive environment (the pin is archive-wide)
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "c5ea00351c28e24afc9f0f84379aa41082b1188f"

[[require]]
name = "Lax15"
path = "../concepts"

# the word RAM: the machine and timed computation of submission Lax13
[[require]]
name = "Lax13"
git = "https://github.com/lax-archive/lax-submissions"
rev = "2087642ed59a81b55a1f1bc09141933368edd97a"
subDir = "word-ram/concepts"

# the graph encoding and the instance format of submission Lax11, whose
# 2^k statement this one improves on
[[require]]
name = "Lax11"
git = "https://github.com/lax-archive/lax-submissions"
rev = "0bbcfec49450cea61c51aff11ad8b1545b766db5"
subDir = "ram-linear-time/concepts"

# the word RAM's verified compilation pipeline, reused as proved
# theorems (deliberate proofs-package dependency)
[[require]]
name = "Lax13Proofs"
git = "https://github.com/lax-archive/lax-submissions"
rev = "2087642ed59a81b55a1f1bc09141933368edd97a"
subDir = "word-ram/proofs"

# the vertex cover model of submission Lax11 — covers, the budget
# predicate and its bridge to the vertex cover number — reused as
# proved theorems (deliberate proofs-package dependency)
[[require]]
name = "Lax11Proofs"
git = "https://github.com/lax-archive/lax-submissions"
rev = "0bbcfec49450cea61c51aff11ad8b1545b766db5"
subDir = "ram-linear-time/proofs"

[[lean_lib]]
name = "Lax15Proofs"
