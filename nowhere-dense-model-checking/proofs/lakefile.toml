name = "Lax3Proofs"
defaultTargets = ["Lax3Proofs"]

[leanOptions]
autoImplicit = false

# mathlib is part of the archive environment (the pin is archive-wide)
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "c5ea00351c28e24afc9f0f84379aa41082b1188f"

[[require]]
name = "Lax3"
path = "../concepts"

# sparsity: nowhere denseness, UQW, generalized coloring numbers (Lax12)
[[require]]
name = "Lax12"
path = "../../sparsity-lectures/concepts"

# the word RAM: the machine and timed computation of submission Lax13
[[require]]
name = "Lax13"
path = "../../word-ram/concepts"

# graph encodings (CSR) of submission Lax11
[[require]]
name = "Lax11"
path = "../../ram-linear-time/concepts"

# the IMP+ toolkit (Spec, run_vcg, Lib) of submission Lax13's proofs,
# consumed the same way Lax11Proofs consumes it
[[require]]
name = "Lax13Proofs"
path = "../../word-ram/proofs"

# the sparsity proof modules (Densification pattern and friends)
[[require]]
name = "Lax12Proofs"
path = "../../sparsity-lectures/proofs"

[[lean_lib]]
name = "Lax3Proofs"
